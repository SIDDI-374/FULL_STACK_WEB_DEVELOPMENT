<!DOCTYPE html>
<head>
    <title>CSS class selector</title>
    <style>
        .hole {
            color:magenta;
            text-size:32px;
            text-align:center;           
        }
        .high {
            color:green;
            font-family:Arial,sans-serif;
            line-height:1.5;
        }
        .low {
            color:red;
        }
        </style>
</head>
<body>
    <h1 class="hole">Welcome to my website</h1>
    <p class="high">this is tell about the paragraph in the elements of the class</p>
    <p class="low">this the second paragraph to tell about class selector</p>
    <p class="high">Visit<a href this>This link</a>for learning</p>
    <p class="low">Thanks for searching!</p>
</body>
</html>
